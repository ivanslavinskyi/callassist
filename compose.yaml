services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: callassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callassist-dev}
      POSTGRES_USER: callassist
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callassist -d callassist"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - callassist-postgres:/var/lib/postgresql/data

volumes:
  callassist-postgres:
