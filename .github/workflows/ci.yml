name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: callassist
          POSTGRES_USER: callassist
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callassist -d callassist"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://callassist:ci-postgres-only@localhost:5432/callassist
      TEST_DATABASE_URL: postgresql://callassist:ci-postgres-only@localhost:5432/callassist_test
      DATA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      PROMO_CODE_HASH_KEY: CAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg=
      STORAGE_DRIVER: postgres
      TELEPHONY_DRIVER: mock
      VERIFICATION_DRIVER: mock
      DURABLE_WORKER_MODE: embedded
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Enable pnpm through Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate migration catalog
        run: pnpm db:migrate:check
      - name: Prepare and migrate databases
        run: |
          pnpm db:test:prepare
          pnpm db:migrate
          pnpm db:migrate
      - name: Audit production dependencies
        run: pnpm security:audit
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Prove database backup and restore
        env:
          RECOVERY_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          RECOVERY_SOURCE_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm db:recovery:drill
      - name: Build
        run: pnpm build
